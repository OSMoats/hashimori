name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # lets release.yml reuse this exact test job as its pre-publish gate

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q --cov=hashimori --cov-report=term-missing
      - name: Rule packs validate
        run: hashimori validate rulepacks/ hashimori/runtime/packs/agent-runtime.yaml
      - name: Runtime tour (self-checking decisions)
        run: bash examples/runtime/tour.sh
      - name: Runtime benchmark harness (smoke, no datasets)
        run: python -c "import runpy, sys; sys.argv = ['run_eval', '--help']; runpy.run_path('benchmarks/runtime/run_eval.py', run_name='__main__')" > /dev/null
      - name: Policy decision tests
        run: hashimori test examples/tests/decisions.yaml --rules rulepacks/baseline rulepacks/red-zone
      - name: Healthcare pack decision tests
        run: hashimori test examples/tests/healthcare-decisions.yaml --rules rulepacks/red-zone rulepacks/healthcare
      - name: Finance pack decision tests
        run: hashimori test examples/tests/finance-decisions.yaml --rules rulepacks/red-zone rulepacks/finance
      - name: AI agent governance pack decision tests
        run: hashimori test examples/tests/ai-agent-governance-decisions.yaml --rules rulepacks/red-zone rulepacks/ai-agent-governance rulepacks/baseline
