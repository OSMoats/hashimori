name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Rule packs validate
        run: hashimori validate rulepacks/ hashimori/runtime/packs/agent-runtime.yaml
      - name: Runtime demo scenes (deterministic)
        run: for i in 1 2 3 4 5 6 7 8; do ./demo/replay.sh $i > /dev/null; done
      - name: Policy decision tests
        run: hashimori test examples/tests/decisions.yaml --rules rulepacks/
