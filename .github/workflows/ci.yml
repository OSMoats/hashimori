name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q --cov=hashimori --cov-report=term-missing
      - name: Rule packs validate
        run: hashimori validate rulepacks/
      - name: Policy decision tests
        run: hashimori test examples/tests/decisions.yaml --rules rulepacks/baseline rulepacks/red-zone
      - name: Healthcare pack decision tests
        run: hashimori test examples/tests/healthcare-decisions.yaml --rules rulepacks/red-zone rulepacks/healthcare
      - name: Finance pack decision tests
        run: hashimori test examples/tests/finance-decisions.yaml --rules rulepacks/red-zone rulepacks/finance
