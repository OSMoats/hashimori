[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hashimori"
version = "0.3.0"
description = "橋守 — a tiny, deterministic rules engine for AI governance: review AI use cases at design time, enforce agent tool calls at runtime. Policy in YAML, decisions in milliseconds, with an audit trail."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Aakash Yadav" }]
keywords = ["ai-governance", "grc", "policy-as-code", "rules-engine", "responsible-ai", "ai-agents", "agent-security", "runtime-enforcement", "claude-code", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=5"]

[project.scripts]
hashimori = "hashimori.cli:main"

[project.urls]
Homepage = "https://github.com/OSMoats/hashimori"
Issues = "https://github.com/OSMoats/hashimori/issues"

[tool.setuptools]
packages = ["hashimori", "hashimori.runtime"]

[tool.setuptools.package-data]
"hashimori.runtime" = ["packs/*.yaml"]
